<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Treasury KPI</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#f4f6f9;
  --card:#fff;
  --bdr:#e2e8f0;
  --surf:#f1f5f9;
  --t1:#0f172a;
  --t2:#475569;
  --t3:#94a3b8;
  --t4:#cbd5e1;
  --up:#16a34a;   --up-bg:#dcfce7;  --up-dk:#15803d;
  --dn:#dc2626;   --dn-bg:#fee2e2;  --dn-dk:#b91c1c;
  --neu:#64748b;  --neu-bg:#f1f5f9;
}
html,body{
  width:100%;height:100%;
  background:var(--bg);
  font-family:'Inter',-apple-system,sans-serif;
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
}
#app{width:calc(100% - 14px);max-width:260px;}

/* ── CARD — always visible, no display toggling ── */
#card{
  background:var(--card);
  border-radius:14px;
  border:0.5px solid var(--bdr);
  overflow:hidden;
  position:relative;
  box-shadow:
    0 1px 2px rgba(15,23,42,.04),
    0 4px 12px rgba(15,23,42,.07),
    0 14px 36px rgba(15,23,42,.05);
}

/* top accent stripe */
#stripe{
  height:3px;
  width:100%;
  background:var(--neu-bg);
}

.body{padding:13px 15px 12px;}

/* label */
#lbl{
  font-size:9px;font-weight:600;
  letter-spacing:.11em;text-transform:uppercase;
  color:var(--t3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  margin-bottom:9px;min-height:12px;
}

/* hero */
.hero{display:flex;align-items:baseline;gap:5px;margin-bottom:3px;}
#hnum{
  font-size:34px;font-weight:600;color:var(--t1);
  letter-spacing:-0.035em;line-height:1;
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.hunit{font-size:12px;font-weight:400;color:var(--t4);letter-spacing:.05em;}

/* divider */
.divl{height:0.5px;background:var(--surf);margin:10px 0;}

/* variance row */
.vrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.vleft{display:flex;align-items:center;gap:5px;}
#ibox{
  width:24px;height:24px;border-radius:7px;
  background:var(--neu-bg);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
#vnum{
  font-size:12.5px;font-weight:600;
  color:var(--neu);
  font-variant-numeric:tabular-nums;white-space:nowrap;
}
.vunit{font-size:10px;font-weight:400;opacity:.6;margin-left:1px;}
#vslbl{font-size:9px;color:var(--t4);}

/* mini bar */
.btrack{height:3px;background:var(--surf);border-radius:99px;overflow:hidden;margin-bottom:5px;}
#bfill{height:100%;border-radius:99px;background:var(--neu-bg);width:0%;transition:width .55s cubic-bezier(.22,.68,0,1);}
.bfoot{display:flex;justify-content:space-between;font-size:8px;color:var(--t4);}
</style>
</head>
<body>
<div id="app">
  <div id="card">
    <div id="stripe"></div>
    <div class="body">
      <div id="lbl">Loading…</div>
      <div class="hero">
        <span id="hnum">—</span>
        <span class="hunit">Bn</span>
      </div>
      <div class="divl"></div>
      <div class="vrow">
        <div class="vleft">
          <div id="ibox">
            <svg id="isvg" width="11" height="11" viewBox="0 0 11 11" fill="none"></svg>
          </div>
          <span id="vnum">—</span>
        </div>
        <span id="vslbl">vs yesterday</span>
      </div>
      <div class="btrack"><div id="bfill"></div></div>
      <div class="bfoot">
        <span id="bleft">—</span>
        <span id="bright">—</span>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';
(function(){

  var $ = function(id){ return document.getElementById(id); };

  /* ── number helpers ── */
  function toBn(n){
    if(n===null||isNaN(n)) return '—';
    var abs=Math.abs(n), s=n<0?'-':'';
    return s+(abs>=1e6?abs/1e9:abs).toFixed(2);
  }
  function signBn(n){
    if(n===null||isNaN(n)) return null;
    var abs=Math.abs(n), s=n>=0?'+':'-';
    return s+(abs>=1e6?abs/1e9:abs).toFixed(2);
  }
  function pctOf(d,a){
    if(!a||!d||a===0) return null;
    var prev=a-d;
    return prev===0?null:(d/Math.abs(prev))*100;
  }
  function pretty(name){
    return name
      .replace(/^(SUM|AVG|MIN|MAX|COUNT|ATTR)\((.+)\)$/i,'$2')
      .replace(/[_-]/g,' ')
      .replace(/\b\w/g,function(c){return c.toUpperCase();})
      .trim();
  }

  /* ── theme: only colours, no show/hide ── */
  function applyTheme(dir){
    var T={
      up:  {s:'#16a34a',ib:'#dcfce7',vc:'#16a34a',bc:'#16a34a',
            svg:'<polyline points="1.5,9 5.5,1.5 9.5,9" fill="none" stroke="#16a34a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'},
      down:{s:'#dc2626',ib:'#fee2e2',vc:'#dc2626',bc:'#dc2626',
            svg:'<polyline points="1.5,1.5 5.5,9 9.5,1.5" fill="none" stroke="#dc2626" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>'},
      neu: {s:'#cbd5e1',ib:'#f1f5f9',vc:'#64748b',bc:'#cbd5e1',
            svg:'<line x1="1.5" y1="5.5" x2="9.5" y2="5.5" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>'}
    }[dir]||{};
    if(!T.s) return;
    $('stripe').style.background = T.s;
    $('ibox').style.background   = T.ib;
    $('isvg').innerHTML          = T.svg;
    $('vnum').style.color        = T.vc;
    $('bfill').style.background  = T.bc;
  }

  /* ── EXACT getData from working doc-7 KPI card ── */
  async function getData(ws){
    var rows=[], reader=await ws.getSummaryDataReaderAsync(undefined,{ignoreSelection:true});
    for(var i=0;i<reader.pageCount;i++){
      var pg=await reader.getPageAsync(i);
      pg.data.forEach(function(r){
        var row={};
        pg.columns.forEach(function(c,idx){ row[c.fieldName]=r[idx]; });
        rows.push(row);
      });
    }
    await reader.releaseAsync();
    return rows;
  }

  /* ── EXACT getEnc from working doc-7 KPI card ── */
  async function getEnc(ws){
    var spec=await ws.getVisualSpecificationAsync(), map={};
    if(spec.activeMarksSpecificationIndex<0) return map;
    var marks=spec.marksSpecifications[spec.activeMarksSpecificationIndex];
    marks.encodings.forEach(function(e){ map[e.id]=e.field; });
    return map;
  }

  /* ── render — no show/hide, just populate ── */
  function render(data, enc){
    /* need actual encoding and at least one row — same guard as doc-7 */
    if(!enc.actual||!data.length) return;

    var row=data[0];

    /* EXACT same dv/num pattern as doc-7 */
    function dv(id){ return enc[id]?row[enc[id].name]||null:null; }
    function num(id){
      var d=dv(id); if(!d) return null;
      var n=parseFloat(d.nativeValue!==undefined?d.nativeValue:d.value);
      return isNaN(n)?null:n;
    }

    var actualN = num('actual');
    var deltaN  = num('delta');

    if(actualN===null) return;

    /* label from field name */
    $('lbl').textContent = pretty(enc.actual.name);

    /* hero */
    $('hnum').textContent = toBn(actualN);

    /* direction & theme */
    var dir = deltaN===null?'neu':deltaN>0?'up':deltaN<0?'down':'neu';
    applyTheme(dir);

    /* variance */
    if(deltaN!==null){
      var sb  = signBn(deltaN);
      var pct = pctOf(deltaN,actualN);
      $('vnum').innerHTML = sb+'<span class="vunit">Bn</span>';
      var bw = Math.min(100,Math.max(2,Math.round(Math.abs(deltaN/actualN)*2000)));
      $('bfill').style.width  = bw+'%';
      $('bleft').textContent  = 'Δ '+sb+' Bn';
      $('bright').textContent = pct!==null?(pct>=0?'+':'')+pct.toFixed(2)+'%':'—';
    } else {
      $('vnum').textContent   = 'Drop Delta field';
      $('bfill').style.width  = '0%';
      $('bleft').textContent  = '—';
      $('bright').textContent = '—';
    }
  }

  /* ── EXACT init pattern from doc-7 working KPI card ── */
  window.onload = tableau.extensions.initializeAsync().then(function(){
    var ws = tableau.extensions.worksheetContent.worksheet;

    var update = async function(){
      var data = await getData(ws);
      var enc  = await getEnc(ws);
      render(data, enc);
    };

    ws.addEventListener(tableau.TableauEventType.SummaryDataChanged, update);
    update();
  });

})();
</script>
</body>
</html>
