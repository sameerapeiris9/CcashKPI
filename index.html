<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Treasury KPI</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* ── TOKENS ── */
:root{
  --bg:     #f4f6f9;
  --card:   #ffffff;
  --bdr:    #e2e8f0;
  --div:    #f1f5f9;
  --t1:     #0f172a;
  --t2:     #334155;
  --t3:     #94a3b8;
  --t4:     #cbd5e1;

  --up:     #16a34a; --up-bg:#dcfce7; --up-dk:#15803d;
  --dn:     #dc2626; --dn-bg:#fee2e2; --dn-dk:#b91c1c;
  --neu:    #64748b; --neu-bg:#f1f5f9; --neu-bdr:#cbd5e1;

  --radius: 16px;
  --font:   'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
}

html,body{
  width:100%;height:100%;
  background:var(--bg);
  font-family:var(--font);
  display:flex;align-items:center;justify-content:center;
  overflow:hidden;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

#app{
  width:calc(100% - 16px);
  max-width:280px;
  position:relative;
}

/* ── PLACEHOLDER ── */
#ph{
  background:var(--card);
  border-radius:var(--radius);
  border:0.5px solid var(--bdr);
  padding:28px 18px;
  text-align:center;
  display:flex;flex-direction:column;align-items:center;gap:9px;
  box-shadow:0 1px 3px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.06);
}
#ph svg{opacity:.25;margin-bottom:2px;}
#ph strong{font-size:12px;font-weight:600;color:var(--t2);}
#ph p{font-size:10.5px;color:var(--t3);line-height:1.7;}
.ph-chip{
  display:flex;align-items:center;gap:7px;
  background:var(--div);border:0.5px solid var(--bdr);
  border-radius:7px;padding:5px 10px;width:100%;
  font-size:10px;font-weight:500;color:var(--t3);
}
.ph-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0;}

/* ── ERROR ── */
#err{
  display:none;
  background:#fff;border:0.5px solid #fca5a5;border-radius:var(--radius);
  padding:14px 16px;font-size:11px;color:var(--dn);
  line-height:1.65;word-break:break-word;
}

/* ── CARD ── */
#card{
  display:none;
  background:var(--card);
  border-radius:var(--radius);
  border:0.5px solid var(--bdr);
  overflow:hidden;
  position:relative;
  box-shadow:
    0 1px 2px rgba(15,23,42,.04),
    0 4px 14px rgba(15,23,42,.07),
    0 16px 40px rgba(15,23,42,.05);
  animation:rise .28s cubic-bezier(.22,.68,0,1.1) both;
}
@keyframes rise{
  from{opacity:0;transform:translateY(7px) scale(.983)}
  to  {opacity:1;transform:none}
}

/* coloured left rail */
#rail{
  position:absolute;
  top:0;left:0;
  width:3px;height:100%;
  border-radius:16px 0 0 16px;
  transition:background .25s ease;
}

/* card inner — left-padded for rail */
.inner{padding:16px 16px 14px 19px;}

/* ── HEADER ── */
.hdr{
  display:flex;align-items:flex-start;
  justify-content:space-between;
  gap:6px;margin-bottom:13px;
}
#card-label{
  font-size:9px;font-weight:600;
  letter-spacing:.11em;text-transform:uppercase;
  color:var(--t3);line-height:1.4;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:72%;
}
#status-badge{
  font-size:8.5px;font-weight:600;
  padding:2px 8px;border-radius:99px;
  white-space:nowrap;flex-shrink:0;
  margin-top:1px;
  transition:background .25s,color .25s;
}

/* ── HERO ── */
.hero{
  display:flex;align-items:baseline;
  gap:5px;margin-bottom:3px;
}
#hero-num{
  font-size:36px;font-weight:600;
  color:var(--t1);
  letter-spacing:-0.035em;line-height:1;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
}
.hero-unit{
  font-size:13px;font-weight:400;
  color:var(--t4);letter-spacing:.04em;
}
#hero-sub{
  font-size:9.5px;color:var(--t4);
  margin-bottom:13px;
}

/* ── DIVIDER ── */
.div{height:0.5px;background:var(--div);margin-bottom:12px;}

/* ── VARIANCE ── */
.var-row{
  display:flex;align-items:center;
  justify-content:space-between;
  margin-bottom:11px;
}
.var-left{display:flex;align-items:center;gap:6px;}
#icon-box{
  width:26px;height:26px;border-radius:8px;
  display:flex;align-items:center;justify-content:center;
  flex-shrink:0;transition:background .25s;
}
#var-val{
  font-size:13px;font-weight:600;
  font-variant-numeric:tabular-nums;
  white-space:nowrap;
  transition:color .25s;
}
.var-unit{font-size:10.5px;font-weight:400;opacity:.65;margin-left:1px;}
#vs-label{font-size:9.5px;color:var(--t4);}

/* ── MINI PROGRESS BAR ── */
.bar-wrap{margin-bottom:0;}
.bar-track{
  height:3px;background:var(--div);
  border-radius:99px;overflow:hidden;
  margin-bottom:5px;
}
#bar-fill{
  height:100%;border-radius:99px;
  transition:width .6s cubic-bezier(.22,.68,0,1),background .25s;
  width:0%;
}
.bar-foot{
  display:flex;justify-content:space-between;
  font-size:8.5px;color:var(--t4);
}
</style>
</head>
<body>
<div id="app">

  <!-- Placeholder -->
  <div id="ph">
    <svg width="36" height="36" viewBox="0 0 36 36" fill="none" style="color:#94a3b8">
      <rect x="2" y="2" width="32" height="32" rx="8" stroke="currentColor" stroke-width="1.5"/>
      <path d="M9 24 L13 16 L19 20 L27 10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="27" cy="10" r="2.5" fill="currentColor"/>
    </svg>
    <strong>Treasury KPI Card</strong>
    <p>Drop measures on the Marks card tiles</p>
    <div style="display:flex;flex-direction:column;gap:5px;width:100%;margin-top:2px">
      <div class="ph-chip"><div class="ph-dot" style="background:#16a34a"></div>Actual (Today) — required</div>
      <div class="ph-chip"><div class="ph-dot" style="background:#3b82f6"></div>Previous (Yesterday) — variance</div>
      <div class="ph-chip"><div class="ph-dot" style="background:#cbd5e1"></div>Card Label — optional</div>
    </div>
  </div>

  <!-- Error -->
  <div id="err"></div>

  <!-- Card -->
  <div id="card">
    <div id="rail"></div>
    <div class="inner">

      <div class="hdr">
        <span id="card-label">KPI METRIC</span>
        <span id="status-badge">—</span>
      </div>

      <div class="hero">
        <span id="hero-num">—</span>
        <span class="hero-unit">Bn</span>
      </div>
      <div id="hero-sub">As of today</div>

      <div class="div"></div>

      <div class="var-row">
        <div class="var-left">
          <div id="icon-box">
            <svg id="icon-svg" width="12" height="12" viewBox="0 0 12 12" fill="none"></svg>
          </div>
          <span id="var-val">—</span>
        </div>
        <span id="vs-label">vs yesterday</span>
      </div>

      <div class="bar-wrap">
        <div class="bar-track"><div id="bar-fill"></div></div>
        <div class="bar-foot">
          <span id="bar-prev">—</span>
          <span id="bar-pct">—</span>
        </div>
      </div>

    </div>
  </div>

</div>
<script>
'use strict';
(function(){

  var $=function(id){return document.getElementById(id);};
  var appEl=$('app');

  /* ── states ── */
  function showPh()  {$('ph').style.display='';$('err').style.display='none';$('card').style.display='none';}
  function showErr(m){$('ph').style.display='none';$('err').style.display='';$('card').style.display='none';$('err').textContent='Error: '+m;}
  function showCard(){$('ph').style.display='none';$('err').style.display='none';$('card').style.display='';}

  /* ── number helpers ── */
  function toBn(n){
    if(n===null||isNaN(n)) return '—';
    var abs=Math.abs(n),s=n<0?'-':'';
    /* already in Bn (|n|<10000) or convert from absolute */
    return s+(abs<10000?abs.toFixed(2):(abs/1e9).toFixed(2));
  }
  function deltaBn(d){
    if(d===null||isNaN(d)) return null;
    var abs=Math.abs(d),s=d>=0?'+':'-';
    return s+(abs<10000?abs.toFixed(2):(abs/1e9).toFixed(2));
  }
  function toPct(d,p){
    if(!p||isNaN(p)||p===0) return null;
    return (d/Math.abs(p))*100;
  }
  function pretty(n){
    return n.replace(/^(SUM|AVG|MIN|MAX|COUNT|ATTR)\((.+)\)$/i,'$2')
            .replace(/[_-]/g,' ')
            .replace(/\b\w/g,function(c){return c.toUpperCase();}).trim();
  }

  /* ── apply theme ── */
  function applyTheme(dir){
    var cfg={
      up :{rail:'#16a34a',badge:'↑ Up',   badgeBg:'#dcfce7',badgeClr:'#15803d',
           iconBg:'#dcfce7',iconSvg:'up',  valClr:'#16a34a',bar:'#16a34a'},
      down:{rail:'#dc2626',badge:'↓ Down', badgeBg:'#fee2e2',badgeClr:'#b91c1c',
           iconBg:'#fee2e2',iconSvg:'down',valClr:'#dc2626',bar:'#dc2626'},
      neu :{rail:'#cbd5e1',badge:'— Hold', badgeBg:'#f1f5f9',badgeClr:'#64748b',
           iconBg:'#f1f5f9',iconSvg:'neu', valClr:'#64748b',bar:'#cbd5e1'}
    }[dir]||{};

    $('rail').style.background=cfg.rail;

    var badge=$('status-badge');
    badge.textContent=cfg.badge;
    badge.style.background=cfg.badgeBg;
    badge.style.color=cfg.badgeClr;

    $('icon-box').style.background=cfg.iconBg;
    $('var-val').style.color=cfg.valClr;
    $('bar-fill').style.background=cfg.bar;

    var svgPaths={
      up  :'<polyline points="2,10 6,2 10,10" fill="none" stroke="'+cfg.rail+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
      down:'<polyline points="2,2 6,10 10,2" fill="none" stroke="'+cfg.rail+'" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>',
      neu :'<line x1="2" y1="6" x2="10" y2="6" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>'
    };
    $('icon-svg').innerHTML=svgPaths[cfg.iconSvg]||'';
  }

  /* ── responsive scale ── */
  function applyScale(w){
    var fs=Math.min(14,Math.max(10,Math.round((w/280)*13)));
    appEl.style.fontSize=fs+'px';
    var hn=$('hero-num');
    if(hn) hn.style.fontSize=Math.min(40,Math.max(22,Math.round((w/280)*36)))+'px';
  }
  if(window.ResizeObserver){
    new ResizeObserver(function(e){applyScale(e[0].contentRect.width);}).observe(appEl);
  }
  window.addEventListener('resize',function(){applyScale(appEl.offsetWidth||280);});

  /* ── data reading (confirmed working pattern) ── */
  async function getData(ws){
    var rows=[],rdr=await ws.getSummaryDataReaderAsync(undefined,{ignoreSelection:true});
    for(var i=0;i<rdr.pageCount;i++){
      var pg=await rdr.getPageAsync(i);
      pg.data.forEach(function(r){
        var row={};
        pg.columns.forEach(function(c,idx){row[c.fieldName]=r[idx];});
        rows.push(row);
      });
    }
    await rdr.releaseAsync();
    return rows;
  }

  async function getEnc(ws){
    var spec=await ws.getVisualSpecificationAsync(),map={};
    if(spec.activeMarksSpecificationIndex<0) return map;
    spec.marksSpecifications[spec.activeMarksSpecificationIndex]
        .encodings.forEach(function(e){map[e.id]=e.field;});
    return map;
  }

  /* ── render ── */
  function render(data,enc){
    if(!enc.actual||!data.length){showPh();return;}
    var row=data[0];

    function dv(id){return enc[id]?row[enc[id].name]||null:null;}
    function num(id){
      var d=dv(id);if(!d) return null;
      var n=parseFloat(d.nativeValue!==undefined?d.nativeValue:d.value);
      return isNaN(n)?null:n;
    }
    function str(id){
      var d=dv(id);if(!d) return null;
      var f=d.formattedValue;
      return(f&&f!=='%null%'&&f!=='Null')?f.trim():null;
    }

    var actualN=num('actual');
    var prevN  =num('previous');
    var labelS =str('label');

    if(actualN===null){showPh();return;}
    showCard();

    /* label */
    var saved=tableau.extensions.settings.get('kpi_label')||'';
    $('card-label').textContent=(saved||labelS||pretty(enc.actual.name)).toUpperCase();

    /* hero */
    $('hero-num').textContent=toBn(actualN);

    /* variance */
    var delta=(prevN!==null)?actualN-prevN:null;
    var pct=delta!==null?toPct(delta,prevN):null;
    var dir=delta===null?'neu':delta>0?'up':delta<0?'down':'neu';

    applyTheme(dir);

    if(delta!==null){
      /* variance value + Bn unit */
      $('var-val').innerHTML=
        deltaBn(delta)+
        ' <span class="var-unit" style="font-size:10.5px;font-weight:400;opacity:.65">Bn</span>';

      /* mini bar: fill = today vs yesterday proportion, capped 0-100 */
      var fillPct=prevN&&prevN!==0?Math.min(100,Math.max(0,Math.round((actualN/Math.abs(prevN))*100))):0;
      $('bar-fill').style.width=fillPct+'%';
      $('bar-prev').textContent='Prev '+toBn(prevN)+' Bn';
      $('bar-pct').textContent=pct!==null?(pct>=0?'+':'')+pct.toFixed(2)+'%':'—';
    } else {
      $('var-val').textContent='No prior data';
      $('bar-fill').style.width='0%';
      $('bar-prev').textContent='Prior unavailable';
      $('bar-pct').textContent='—';
    }

    applyScale(appEl.offsetWidth||280);
  }

  /* ── init ── */
  window.onload=tableau.extensions.initializeAsync().then(function(){
    var ws=tableau.extensions.worksheetContent.worksheet;
    async function update(){
      try{var data=await getData(ws),enc=await getEnc(ws);render(data,enc);}
      catch(e){showErr(String(e));}
    }
    ws.addEventListener(tableau.TableauEventType.SummaryDataChanged,update);
    update();
  },function(e){showErr('Init: '+String(e));});

})();
</script>
</body>
</html>
