<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<title>Treasury KPI — Debug</title>
<script src="https://cdn.jsdelivr.net/gh/tableau/extensions-api/lib/tableau.extensions.1.latest.js"></script>
<style>
  body{font-family:monospace;font-size:11px;background:#f4f6f9;padding:12px;margin:0}
  .ok{background:#dcfce7;color:#15803d;padding:6px 10px;border-radius:6px;margin-bottom:8px;font-weight:600}
  .err{background:#fee2e2;color:#b91c1c;padding:6px 10px;border-radius:6px;margin-bottom:8px;font-weight:600}
  h4{font-size:10px;font-weight:700;color:#64748b;letter-spacing:.06em;text-transform:uppercase;margin:10px 0 4px}
  pre{background:#fff;border:0.5px solid #e2e8f0;border-radius:6px;padding:8px;white-space:pre-wrap;word-break:break-all;max-height:220px;overflow-y:auto;font-size:10px}
</style>
</head>
<body>
<div id="status">Initialising…</div>

<h4>Encoding map</h4>
<pre id="enc-out">waiting…</pre>

<h4>Row[0] raw keys + values</h4>
<pre id="row-out">waiting…</pre>

<h4>Computed (actual / previous / label)</h4>
<pre id="val-out">waiting…</pre>

<script>
'use strict';
(function(){

  async function getData(ws){
    var rows=[],rdr=await ws.getSummaryDataReaderAsync(undefined,{ignoreSelection:true});
    for(var i=0;i<rdr.pageCount;i++){
      var pg=await rdr.getPageAsync(i);
      pg.data.forEach(function(r){
        var row={};
        pg.columns.forEach(function(c,idx){row[c.fieldName]=r[idx];});
        rows.push(row);
      });
    }
    await rdr.releaseAsync();
    return rows;
  }

  async function getEnc(ws){
    var spec=await ws.getVisualSpecificationAsync(),map={};
    if(spec.activeMarksSpecificationIndex<0) return map;
    spec.marksSpecifications[spec.activeMarksSpecificationIndex]
        .encodings.forEach(function(e){map[e.id]=e.field;});
    return map;
  }

  window.onload=tableau.extensions.initializeAsync().then(function(){
    var ws=tableau.extensions.worksheetContent.worksheet;

    async function update(){
      try{
        document.getElementById('status').className='ok';
        document.getElementById('status').textContent='✓ Init OK — sheet: '+ws.name;

        var data=await getData(ws);
        var enc =await getEnc(ws);

        /* encoding map */
        var encDump={};
        Object.keys(enc).forEach(function(k){
          encDump[k]=enc[k]?{name:enc[k].name,role:enc[k].role,dataType:enc[k].dataType}:null;
        });
        document.getElementById('enc-out').textContent=JSON.stringify(encDump,null,2);

        /* row 0 */
        if(data.length){
          var r0=data[0],dump={};
          Object.keys(r0).forEach(function(k){
            var dv=r0[k];
            dump[k]={value:dv?dv.value:null,nativeValue:dv?dv.nativeValue:null,formattedValue:dv?dv.formattedValue:null};
          });
          document.getElementById('row-out').textContent='rows: '+data.length+'\n\n'+JSON.stringify(dump,null,2);
        } else {
          document.getElementById('row-out').textContent='NO ROWS RETURNED';
        }

        /* computed */
        var res={};
        ['actual','previous','label'].forEach(function(id){
          if(!enc[id]){res[id+'_enc']='NOT MAPPED';return;}
          res[id+'_fieldName']=enc[id].name;
          if(!data.length){res[id]='NO ROWS';return;}
          var dv=data[0][enc[id].name];
          if(!dv){
            /* try partial match */
            var k=Object.keys(data[0]).find(function(k2){
              return k2.toLowerCase().indexOf(enc[id].name.replace(/^(SUM|AVG)\(/i,'').replace(/\)$/,'').toLowerCase())>=0;
            });
            res[id+'_fallback']=k||'NOT FOUND';
            dv=k?data[0][k]:null;
          }
          res[id]=dv?{value:dv.value,nativeValue:dv.nativeValue,formattedValue:dv.formattedValue}:'NULL';
        });
        document.getElementById('val-out').textContent=JSON.stringify(res,null,2);

      } catch(e){
        document.getElementById('status').className='err';
        document.getElementById('status').textContent='ERROR: '+String(e);
        console.error(e);
      }
    }

    ws.addEventListener(tableau.TableauEventType.SummaryDataChanged,update);
    update();
  },function(e){
    document.getElementById('status').className='err';
    document.getElementById('status').textContent='INIT FAILED: '+String(e);
  });

})();
</script>
</body>
</html>
